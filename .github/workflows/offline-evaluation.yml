name: Offline evaluation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Seed deterministic demo data
        working-directory: backend
        run: python seed_demo_data.py
      - name: Generate synthetic ecommerce data and schema
        working-directory: backend
        run: |
          python scripts/generate_ecommerce_data.py
          python scripts/generate_ecommerce_schema.py
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -q
      - name: Check offline evaluation gate
        working-directory: backend
        run: python -m app.eval_gate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
